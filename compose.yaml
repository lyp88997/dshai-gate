name: dshai

services:
  dsh:
    build:
      context: .
      args:
        DSH_VERSION: "0.1.5-rc.1"
    image: dsh-official:0.1.5-rc.1
    container_name: dshai-web
    restart: on-failure:5
    init: true
    network_mode: host
    mem_limit: 800m
    memswap_limit: 1300m
    environment:
      - NODE_ENV=production
      - SSH_CONNECTION=127.0.0.1 0 127.0.0.1 22
      - DSH_WEB_URL=https://dsh.example.com
    volumes:
      - ./data:/home/node/.dsh
      - ./workspaces:/home/node/workspaces
      - ./home:/home/node
    command: ["web", "--no-open", "--port", "3082",
              "--trusted-host", "dsh.example.com",
              "--trusted-host", "dsh.example.com:443"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3082/manifest.webmanifest').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  gate:
    build: ./gate
    image: dsh-gate:1.3.2
    container_name: dshai-gate
    restart: on-failure:5
    network_mode: host
    environment:
      - GATE_LISTEN=127.0.0.1:2299
      - GATE_UPSTREAM=http://127.0.0.1:3082
      - GATE_INJECT=1
      - GATE_SITE_TITLE=Harness
      - GATE_SESSION_DAYS=30
      - GATE_PASSWORD_HASH=${GATE_PASSWORD_HASH}
      - GATE_TOTP_SECRET=${GATE_TOTP_SECRET}
      - GATE_SESSION_SECRET=${GATE_SESSION_SECRET}
    depends_on:
      - dsh
