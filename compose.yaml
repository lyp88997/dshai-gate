name: dshai

services:
  dsh:
    build:
      context: .
      args:
        # DSH 版本是**钉死**的，不会跟着 npm 上的最新版跑。默认值写在这里；
        # 想临时试别的版本不必改文件：DSH_VERSION=0.2.1 docker compose build dsh
        # （也可以写进同目录的 .env）。image 标签用同一个变量，免得出现
        # 「镜像名对不上、内容已是新版」的情况。
        DSH_VERSION: "${DSH_VERSION:-0.2.0-rc.2}"
    image: dsh-official:${DSH_VERSION:-0.2.0-rc.2}
    container_name: dshai-web
    restart: unless-stopped
    init: true
    network_mode: host
    # ★ 内存：下限 1400m，本机取 2560m。依据（均实测）：
    #   ① Node 的 JS 堆上限 = 容器内存限额÷2 + 96MB
    #      （1200m→696MB、1500m→846MB；据此 800m 仅约 496MB）。
    #   ② 硬需求 1358MB = DSH 本体 966MB + univer-office 网关 392MB。
    #      1200m 时超出部分被换进交换文件（memory.swap.current=622MB）；1400m 才装得下。
    #   ③ 本机（VM-0-5-debian）总内存 3858MB、交换 1023MB；其他容器合计不到 100MB
    #      （OpenResty 26 + frps 47 + 门禁 10）。2560m 给 DSH 约占 65%，
    #      宿主自身（系统 + 1Panel）约需 690MB，仍留得住余量。
    #      实测容器峰值 1225MB / 2048MB（60%），2560m 是这台 3.8GB 机器上的稳妥上限；
    #      再往上到 3g，宿主只剩百来 MB，反代/隧道被杀的风险明显上升。
    #
    # ★ 不要用 docker update 手工改大了事：那不会写回本文件，
    #   下一次 docker compose up -d 重建容器时会悄悄改回这里的值（2026-09-27 实测踩到过：
    #   容器实际是 2g，本文件却是 1400m）。要调就改这里再重建。
    mem_limit: 2560m
    memswap_limit: 3584m
    # 崩溃转储会落到工作目录（core_pattern=core），一次 1.5GB，直接关掉
    ulimits:
      core: 0
    environment:
      - NODE_ENV=production
      - SSH_CONNECTION=127.0.0.1 0 127.0.0.1 22
      - DSH_WEB_URL=https://${DSH_TRUSTED_HOST:-dsh.example.com}
    volumes:
      - ./data:/home/node/.dsh
      - ./workspaces:/home/node/workspaces
      - ./home:/home/node
      - ./plugins:/home/node/plugins:ro
    command: ["web", "--no-open", "--port", "3082",
              "--trusted-host", "${DSH_TRUSTED_HOST:-dsh.example.com}",
              "--trusted-host", "${DSH_TRUSTED_HOST:-dsh.example.com}:443"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3082/manifest.webmanifest').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  gate:
    build: ./gate
    image: dsh-gate:1.10.0
    container_name: dshai-gate
    restart: unless-stopped
    network_mode: host
    environment:
      - GATE_LISTEN=127.0.0.1:2299
      - GATE_UPSTREAM=http://127.0.0.1:3082
      - GATE_INJECT=1
      - GATE_SITE_TITLE=Harness
      - GATE_SESSION_DAYS=30
      # DSH 会话在门禁侧的有效期（天）：门禁自己记「这台设备上次配对成功」的时间，
      # 超期就要求重新填一次 DSH 令牌（后台「DSH 会话」卡里直接填，不必重走登录）。
      - GATE_DSH_SESSION_DAYS=30
      # 后台页会改的配置（GitHub OAuth 的 client id/secret、登录方式开关）落在这里。
      # ★ 不能写进 environment：那会被 `docker inspect` 原样看到。
      # ★ 目录必须可写：镜像内门禁以 65534 运行，宿主上先执行一次
      #   mkdir -p /opt/dshai/gate-data && chown 65534:65534 /opt/dshai/gate-data
      #   目录不可写时门禁不会挂，只降级成「只存内存 + 日志告警」（后台页会显示警告）。
      - GATE_STATE=/data/state.json
      - GATE_PASSWORD_HASH=${GATE_PASSWORD_HASH}
      - GATE_TOTP_SECRET=${GATE_TOTP_SECRET}
      - GATE_SESSION_SECRET=${GATE_SESSION_SECRET}
      # 1.9.0 三要素登录：用户名。留空 = 不要用户名框（保持旧行为）；
      # 要用则必须同时配 GATE_PASSWORD_HASH，否则门禁拒绝启动。
      - GATE_USERNAME=${GATE_USERNAME:-}
      # 1.9.0 DSH 会话自动获取：DSH `.credentials.yaml` 里
      # client-connection/browser-session 的 32 字节 secret（base64url，43 字符）。
      # 配上后登录页不再显示「DSH 令牌」框，登录时门禁自己向 DSH 换会话；
      # 留空 = 保持旧行为（手工粘贴令牌）。
      - GATE_DSH_SESSION_KEY=${GATE_DSH_SESSION_KEY:-}
      # 日志与后台页时间跟随本地时区。gate 镜像基于 alpine（无 zoneinfo），时区库由
      # gate/main.go 里的 `_ "time/tzdata"` 内嵌；不设 TZ 会退回 UTC，页面时间早 8 小时
      # （2026-09-27 实测：宿主 18:45:35 CST 而容器 10:45:35 UTC）。
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - ./gate-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - dsh
