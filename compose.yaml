name: dshai

services:
  dsh:
    build:
      context: .
      args:
        DSH_VERSION: "0.1.5-rc.3"
    image: dsh-official:0.1.5-rc.3
    container_name: dshai-web
    restart: unless-stopped
    init: true
    network_mode: host
    # ★ 下限 1400m，勿降。两层依据（均实测）：
    #   ① Node 的 JS 堆上限 = 容器内存限额÷2 + 96MB
    #      （1200m→696MB、飞牛 1500m→846MB；据此 800m 仅约 496MB）。
    #   ② 硬需求 1358MB = DSH 本体 966MB + univer-office 网关 392MB。
    #      1200m 时超出部分被换进交换文件（memory.swap.current=622MB）；1400m 才装得下。
    #   主机共 1974MB、宿主自身约需 350MB —— 1400m 已接近这台机器上限，不要再加。
    mem_limit: 1400m
    memswap_limit: 2400m
    # 崩溃转储会落到工作目录（core_pattern=core），一次 1.5GB，直接关掉
    ulimits:
      core: 0
    environment:
      - NODE_ENV=production
      - SSH_CONNECTION=127.0.0.1 0 127.0.0.1 22
      - DSH_WEB_URL=https://${DSH_TRUSTED_HOST:-dsh.example.com}
    volumes:
      - ./data:/home/node/.dsh
      - ./workspaces:/home/node/workspaces
      - ./home:/home/node
      - ./plugins:/home/node/plugins:ro
    command: ["web", "--no-open", "--port", "3082",
              "--trusted-host", "${DSH_TRUSTED_HOST:-dsh.example.com}",
              "--trusted-host", "${DSH_TRUSTED_HOST:-dsh.example.com}:443"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3082/manifest.webmanifest').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  gate:
    build: ./gate
    image: dsh-gate:1.5.4
    container_name: dshai-gate
    restart: unless-stopped
    network_mode: host
    environment:
      - GATE_LISTEN=127.0.0.1:2299
      - GATE_UPSTREAM=http://127.0.0.1:3082
      - GATE_INJECT=1
      - GATE_SITE_TITLE=Harness
      - GATE_SESSION_DAYS=30
      - GATE_PASSWORD_HASH=${GATE_PASSWORD_HASH}
      - GATE_TOTP_SECRET=${GATE_TOTP_SECRET}
      - GATE_SESSION_SECRET=${GATE_SESSION_SECRET}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - dsh
